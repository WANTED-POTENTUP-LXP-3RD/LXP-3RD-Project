services:
  mysql:
    image: mysql:8.0
    container_name: lxp-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "23306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_REPOSITORY}/lernix-server:latest
    container_name: lxp-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      APP_CDN_BASE_URL: ${APP_CDN_BASE_URL}
      FILE_STORAGE_BASE_PATH: ${FILE_STORAGE_BASE_PATH}
      FILE_STORAGE_PUBLIC_URL_PREFIX: ${FILE_STORAGE_PUBLIC_URL_PREFIX}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CLOUD_S3_BUCKET: ${CLOUD_S3_BUCKET}
      CLOUD_S3_EXPIRE_SECONDS: ${CLOUD_S3_EXPIRE_SECONDS}
      CLOUD_S3_REGION_STATIC: ${CLOUD_S3_REGION_STATIC}
      CLOUD_S3_ACCESS_KEY: ${CLOUD_S3_ACCESS_KEY}
      CLOUD_S3_SECRET_KEY: ${CLOUD_S3_SECRET_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE}
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/uploads-raw;
      mc mb --ignore-existing local/lecture;
      mc anonymous set none local/uploads-raw;
      mc anonymous set none local/lecture;
      exit 0;
      "

volumes:
  mysql_data:
  minio_data: