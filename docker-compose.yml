services:
  mysql:
    image: mysql:8.0
    container_name: lxp-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "23306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_REPOSITORY}/lernix-server:latest
    container_name: lxp-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      APP_CDN_BASE_URL: ${APP_CDN_BASE_URL}
      FILE_STORAGE_BASE_PATH: ${FILE_STORAGE_BASE_PATH}
      FILE_STORAGE_PUBLIC_URL_PREFIX: ${FILE_STORAGE_PUBLIC_URL_PREFIX}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CLOUD_S3_BUCKET: ${CLOUD_S3_BUCKET}
      CLOUD_S3_EXPIRE_SECONDS: ${CLOUD_S3_EXPIRE_SECONDS}
      CLOUD_S3_REGION_STATIC: ${CLOUD_S3_REGION_STATIC}
      CLOUD_S3_ACCESS_KEY: ${CLOUD_S3_ACCESS_KEY}
      CLOUD_S3_SECRET_KEY: ${CLOUD_S3_SECRET_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE}
    ports:
      - "8080:8080"

volumes:
  mysql_data: