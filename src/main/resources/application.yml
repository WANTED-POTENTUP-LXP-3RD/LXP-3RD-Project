server:
  port: 8080

spring:
  application:
    name: LXP-Project

  web:
    resources:
      add-mappings: false  # 기본 정적 리소스 핸들러 비활성화

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  # Gmail SMTP 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}  # 환경변수 또는 직접 입력
    password: ${GMAIL_APP_PASSWORD:}  # Gmail 앱 비밀번호 (환경변수 권장)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  access-token-expiration: 3600000 # 1시간 (밀리초)
  refresh-token-expiration: 604800000 # 7일 (밀리초)
  header: Authorization
  prefix: Bearer

cors:
  allowed-origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

logging:
  level:
    org.springframework.security: DEBUG
