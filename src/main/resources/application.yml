server:
  port: 8080

spring:
  application:
    name: LXP-Project

  # H2 데이터베이스 설정
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 콘솔 활성화
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA 설정
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # 정적 리소스 및 심볼릭 링크 설정
  web:
    resources:
      add-mappings: true
      chain:
        strategy:
          content:
            enabled: true
      static-locations: classpath:/static/,file:${user.dir}/src/main/resources/static/

# JWT 설정
jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  access-token-expiration: 3600000 # 1시간 (밀리초)
  refresh-token-expiration: 604800000 # 7일 (밀리초)
  header: Authorization
  prefix: Bearer

# 파일 저장 설정
file:
  storage:
    base-path: ${user.dir}/src/main/resources/static/storage
    public-url-prefix: /storage

# CDN/파일 URL 설정
app:
  cdn:
    base-url: http://localhost:8080